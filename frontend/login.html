<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login | ShopKart</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <main class="auth">
    <div class="login-card form-container">
      <div class="login-logo"></div>
      <h1>Welcome to ShopKart</h1>
      <p class="hint">Sign in to shop, manage your cart, place orders and track order status.</p>

      

      <form onsubmit="loginUser(event)">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="Enter email" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter password" autocomplete="current-password" required>
        <button type="submit">Login</button>
      </form>

      <p id="message" class="message"></p>
      <p>New customer? <a href="register.html">Create a customer account</a></p>
    </div>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
