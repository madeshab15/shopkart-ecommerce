<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ShopKart | E-Commerce</title>
  <script>
    if (!localStorage.getItem("access_token")) {
      location.replace("login.html?next=index.html");
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav>
  <a class="brand" href="index.html">🛒 ShopKart</a>
  <div class="navlinks">
    <a href="index.html">Products</a>
    <a href="cart.html">Cart <span id="cartCount">0</span></a>
    <a href="orders.html">Orders</a>
    <a href="admin.html">Admin</a>
    <a href="login.html" id="authLink">Login</a>
  </div>
</nav>
<main class="container">
  <section class="hero">
    <div>
      <span class="badge">FULL-STACK E-COMMERCE</span>
      <h1>Everything you need, in one place.</h1>
      <p>Browse products, manage your cart, checkout securely and track orders with real MySQL inventory.</p>
    </div>
  </section>
  <div class="toolbar">
    <input id="search" placeholder="🔎 Search products..." oninput="loadProducts()">
    <select id="categoryFilter" onchange="loadProducts()"><option value="">All categories</option></select>
  </div>
  <div id="products" class="grid"></div>
</main>
<script src="js/app.js"></script>
<script>initHome()</script>
</body>
</html>
